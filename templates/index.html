<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telegram Channel Finder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <main class="container">
      <h1>Поиск Telegram-каналов по вашим условиям</h1>
      <p class="hint">Данные API сохраняются локально в файле <code>tg_defaults.json</code>, чтобы не вводить каждый раз.</p>

      <form id="parser-form" class="panel">
        <div class="row">
          <label>API ID
            <input type="number" name="api_id" required />
          </label>
          <label>API HASH
            <input type="text" name="api_hash" required />
          </label>
        </div>

        <div class="row">
          <label>Телефон Telegram
            <input type="text" name="phone" placeholder="+79990000000" required />
          </label>
          <label>Поисковые запросы (через запятую)
            <input type="text" name="queries" placeholder="новости, политика, спорт" required />
          </label>
        </div>

        <details>
          <summary>Прокси SOCKS5 (если Telegram не подключается)</summary>
          <div class="row">
            <label>Proxy host
              <input type="text" name="proxy_host" placeholder="127.0.0.1" />
            </label>
            <label>Proxy port
              <input type="number" name="proxy_port" value="1080" />
            </label>
          </div>
          <div class="row">
            <label>Proxy username
              <input type="text" name="proxy_username" />
            </label>
            <label>Proxy password
              <input type="password" name="proxy_password" />
            </label>
          </div>
        </details>

        <div class="row">
          <label>Категория
            <select name="category">
              <option value="any">any</option>
              <option value="news">news</option>
              <option value="finance">finance</option>
              <option value="tech">tech</option>
              <option value="education">education</option>
              <option value="entertainment">entertainment</option>
            </select>
          </label>
          <label>Минимум подписчиков
            <input type="number" name="min_subscribers" value="500" min="0" />
          </label>
        </div>

        <div class="row">
          <label>Языки каналов (можно несколько)
            <select name="languages" multiple size="4">
              <option value="ru">ru</option>
              <option value="en">en</option>
              <option value="other">other</option>
            </select>
          </label>
          <label>Страны каналов (можно несколько)
            <select name="countries" multiple size="6">
              <option value="russia">russia</option>
              <option value="ukraine">ukraine</option>
              <option value="kazakhstan">kazakhstan</option>
              <option value="belarus">belarus</option>
              <option value="usa">usa</option>
              <option value="unknown">unknown</option>
            </select>
          </label>
        </div>

        <div class="row">
          <label>Минимум ER (%)
            <input type="number" name="min_engagement_rate" value="2" step="0.1" min="0" />
          </label>
          <label>Постов за период минимум
            <input type="number" name="min_recent_posts" value="3" min="0" />
          </label>
        </div>

        <div class="row">
          <label>Активен за последние (дней)
            <input type="number" name="active_within_days" value="14" min="1" />
          </label>
          <label>Глубина анализа (дней)
            <input type="number" name="lookback_days" value="30" min="1" />
          </label>
        </div>

        <div class="row">
          <label>Лимит каналов
            <input type="number" name="max_channels" value="100" min="1" max="500" />
          </label>
          <label class="checkbox-line">
            <input type="checkbox" name="require_comments" checked />
            Только каналы с открытыми комментариями
          </label>
        </div>

        <div class="actions">
          <button type="button" id="save-settings-btn">Сохранить API/телефон</button>
          <button type="button" id="check-proxy-btn">Проверить прокси</button>
          <button type="submit">Запустить парсинг</button>
          <button type="button" id="export-btn" disabled>Выгрузить CSV</button>
        </div>
      </form>

      <section id="status" class="status"></section>

      <section class="panel">
        <h2>Результаты</h2>
        <div id="results"></div>
      </section>
    </main>

    <script>
      const form = document.getElementById('parser-form');
      const statusEl = document.getElementById('status');
      const resultsEl = document.getElementById('results');
      const exportBtn = document.getElementById('export-btn');
      const saveBtn = document.getElementById('save-settings-btn');
      const checkProxyBtn = document.getElementById('check-proxy-btn');
      let lastItems = [];

      const setStatus = (text, ok = true) => {
        statusEl.textContent = text;
        statusEl.className = ok ? 'status ok' : 'status error';
      };

      async function loadDefaults() {
        const resp = await fetch('/api/settings');
        const data = await resp.json();
        if (!data.ok) return;
        const s = data.settings || {};
        for (const key of ['api_id', 'api_hash', 'phone', 'proxy_host', 'proxy_port', 'proxy_username', 'proxy_password']) {
          if (form.elements[key]) form.elements[key].value = s[key] || '';
        }
      }

      saveBtn.addEventListener('click', async () => {
        const payload = {
          api_id: form.elements.api_id.value,
          api_hash: form.elements.api_hash.value,
          phone: form.elements.phone.value,
          proxy_host: form.elements.proxy_host.value,
          proxy_port: form.elements.proxy_port.value,
          proxy_username: form.elements.proxy_username.value,
          proxy_password: form.elements.proxy_password.value,
        };
        const resp = await fetch('/api/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await resp.json();
        if (resp.ok && data.ok) {
          setStatus('Настройки сохранены. Теперь API ID/HASH/телефон подставляются автоматически.');
        } else {
          setStatus('Не удалось сохранить настройки', false);
        }
      });


      checkProxyBtn.addEventListener('click', async () => {
        const payload = {
          proxy_host: form.elements.proxy_host.value,
          proxy_port: form.elements.proxy_port.value,
          proxy_username: form.elements.proxy_username.value,
          proxy_password: form.elements.proxy_password.value,
        };
        const resp = await fetch('/api/check_proxy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await resp.json();
        if (!resp.ok || !data.ok) {
          setStatus(data.error || data.message || 'Прокси не прошел проверку', false);
          return;
        }
        setStatus(data.message || 'Прокси успешно проверен.');
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(form);
        setStatus('Идет парсинг... Если видите TimeoutError в консоли, включите SOCKS5 прокси и повторите.');

        const resp = await fetch('/api/parse', { method: 'POST', body: fd });
        const data = await resp.json();

        if (!resp.ok || !data.ok) {
          setStatus(data.error || 'Ошибка парсинга', false);
          return;
        }

        lastItems = data.items || [];
        exportBtn.disabled = lastItems.length === 0;
        setStatus(`Готово. Найдено каналов: ${data.count}`);

        if (!lastItems.length) {
          resultsEl.innerHTML = '<p>Нет каналов по заданным фильтрам.</p>';
          return;
        }

        resultsEl.innerHTML = lastItems
          .map(
            (item) => `
            <article class="item">
              <a href="https://t.me/${item.username.replace('@', '')}" target="_blank">${item.username}</a>
              <div class="meta">${item.title} · подписчики: ${item.subscribers} · ER: ${item.engagement_rate}% · категория: ${item.category}</div>
              <div class="meta">язык: ${item.language} · страна: ${item.country} · комментарии: ${item.comments_enabled ? 'открыты' : 'закрыты'}</div>
            </article>`
          )
          .join('');
      });

      exportBtn.addEventListener('click', async () => {
        if (!lastItems.length) return;
        const resp = await fetch('/api/export', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items: lastItems }),
        });

        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'telegram_channels.csv';
        a.click();
        URL.revokeObjectURL(url);
      });

      loadDefaults();
    </script>
  </body>
</html>
