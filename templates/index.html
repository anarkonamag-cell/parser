<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telegram Channel Finder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <main class="container">
      <h1>Поиск Telegram-каналов по вашим условиям</h1>
      <p class="hint">Режимы подключения: без прокси / MTProto / SOCKS5.</p>

      <form id="parser-form" class="panel">
        <div class="row">
          <label>API ID <input type="number" name="api_id" required /></label>
          <label>API HASH <input type="text" name="api_hash" required /></label>
        </div>
        <div class="row">
          <label>Телефон Telegram <input type="text" name="phone" required /></label>
          <label>Поисковые запросы <input type="text" name="queries" placeholder="новости, crypto" required /></label>
        </div>

        <label>Режим прокси
          <select name="proxy_mode" id="proxy_mode">
            <option value="none">Без прокси</option>
            <option value="mtproto">MTProto</option>
            <option value="socks5">SOCKS5</option>
          </select>
        </label>

        <details id="mtproto-box">
          <summary>MTProto настройки</summary>
          <div class="row">
            <label>MTProto host <input type="text" name="mtproto_host" /></label>
            <label>MTProto port <input type="number" name="mtproto_port" value="443" /></label>
          </div>
          <div class="row">
            <label>MTProto secret <input type="text" name="mtproto_secret" /></label>
            <label>MTProto DC/ID <input type="text" name="mtproto_dc_id" /></label>
          </div>
        </details>

        <details id="socks5-box">
          <summary>SOCKS5 настройки</summary>
          <div class="row">
            <label>SOCKS5 host <input type="text" name="socks5_host" /></label>
            <label>SOCKS5 port <input type="number" name="socks5_port" value="1080" /></label>
          </div>
          <div class="row">
            <label>SOCKS5 username <input type="text" name="socks5_username" /></label>
            <label>SOCKS5 password <input type="password" name="socks5_password" /></label>
          </div>
        </details>

        <div class="row">
          <label>Категория
            <select name="category"><option value="any">any</option><option value="news">news</option><option value="finance">finance</option><option value="tech">tech</option><option value="education">education</option><option value="entertainment">entertainment</option></select>
          </label>
          <label>Минимум подписчиков <input type="number" name="min_subscribers" value="500" /></label>
        </div>

        <div class="row">
          <label>Языки
            <select name="languages" multiple size="3"><option value="ru">ru</option><option value="en">en</option><option value="other">other</option></select>
          </label>
          <label>Страны
            <select name="countries" multiple size="14">
              <option value="germany">germany</option><option value="france">france</option><option value="italy">italy</option><option value="spain">spain</option><option value="portugal">portugal</option><option value="netherlands">netherlands</option><option value="belgium">belgium</option><option value="switzerland">switzerland</option><option value="austria">austria</option><option value="poland">poland</option><option value="czechia">czechia</option><option value="slovakia">slovakia</option><option value="hungary">hungary</option><option value="romania">romania</option><option value="bulgaria">bulgaria</option><option value="greece">greece</option><option value="croatia">croatia</option><option value="serbia">serbia</option><option value="slovenia">slovenia</option><option value="bosnia">bosnia</option><option value="montenegro">montenegro</option><option value="albania">albania</option><option value="north_macedonia">north_macedonia</option><option value="norway">norway</option><option value="sweden">sweden</option><option value="finland">finland</option><option value="denmark">denmark</option><option value="ireland">ireland</option><option value="iceland">iceland</option><option value="estonia">estonia</option><option value="latvia">latvia</option><option value="lithuania">lithuania</option><option value="luxembourg">luxembourg</option><option value="malta">malta</option><option value="cyprus">cyprus</option><option value="ukraine">ukraine</option><option value="belarus">belarus</option><option value="russia">russia</option><option value="kazakhstan">kazakhstan</option><option value="usa">usa</option><option value="unknown">unknown</option>
            </select>
          </label>
        </div>

        <div class="actions">
          <button type="button" id="save-settings-btn">Сохранить настройки</button>
          <button type="button" id="check-proxy-btn">Проверить текущий режим</button>
          <button type="submit">Запустить парсинг</button>
          <button type="button" id="export-btn" disabled>Выгрузить CSV</button>
        </div>
      </form>

      <section id="status" class="status"></section>
      <section class="panel"><h2>Результаты</h2><div id="results"></div></section>
    </main>

    <script>
      const form = document.getElementById('parser-form');
      const statusEl = document.getElementById('status');
      const resultsEl = document.getElementById('results');
      const exportBtn = document.getElementById('export-btn');
      const saveBtn = document.getElementById('save-settings-btn');
      const checkProxyBtn = document.getElementById('check-proxy-btn');
      const proxyModeEl = document.getElementById('proxy_mode');
      const mtBox = document.getElementById('mtproto-box');
      const socksBox = document.getElementById('socks5-box');
      let lastItems = [];

      const setStatus = (text, ok = true) => { statusEl.textContent = text; statusEl.className = ok ? 'status ok' : 'status error'; };
      const refreshProxyBoxes = () => {
        const mode = proxyModeEl.value;
        mtBox.open = mode === 'mtproto';
        socksBox.open = mode === 'socks5';
      };
      proxyModeEl.addEventListener('change', refreshProxyBoxes);

      async function loadDefaults() {
        const resp = await fetch('/api/settings'); const data = await resp.json(); if (!data.ok) return;
        const s = data.settings || {};
        Object.keys(s).forEach((k) => { if (form.elements[k]) form.elements[k].value = s[k] || ''; });
        refreshProxyBoxes();
      }

      saveBtn.addEventListener('click', async () => {
        const payload = Object.fromEntries(new FormData(form).entries());
        const resp = await fetch('/api/settings', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
        const data = await resp.json();
        setStatus(resp.ok && data.ok ? 'Настройки сохранены.' : 'Не удалось сохранить настройки', resp.ok && data.ok);
      });

      checkProxyBtn.addEventListener('click', async () => {
        const payload = Object.fromEntries(new FormData(form).entries());
        const resp = await fetch('/api/check_proxy', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
        const data = await resp.json();
        setStatus((data.message || data.error || 'Ошибка проверки'), resp.ok && data.ok);
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(form);
        setStatus('Идет парсинг...');
        const resp = await fetch('/api/parse', { method: 'POST', body: fd });
        const data = await resp.json();
        if (!resp.ok || !data.ok) return setStatus(data.error || 'Ошибка парсинга', false);
        lastItems = data.items || []; exportBtn.disabled = !lastItems.length; setStatus(`Готово. Найдено каналов: ${data.count}`);
        resultsEl.innerHTML = !lastItems.length ? '<p>Нет каналов по фильтрам.</p>' : lastItems.map((item) => `<article class="item"><a href="https://t.me/${item.username.replace('@','')}" target="_blank">${item.username}</a><div class="meta">${item.title} · ${item.country} · ${item.language} · ER ${item.engagement_rate}%</div></article>`).join('');
      });

      exportBtn.addEventListener('click', async () => {
        if (!lastItems.length) return;
        const resp = await fetch('/api/export', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ items:lastItems }) });
        const blob = await resp.blob(); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'telegram_channels.csv'; a.click(); URL.revokeObjectURL(url);
      });

      loadDefaults();
    </script>
  </body>
</html>
